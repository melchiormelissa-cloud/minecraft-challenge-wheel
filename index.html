<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Challenge Wheel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="title-wrap">
          <p class="kicker">Random Challenge</p>
          <h1>Minecraft Wheel</h1>
        </div>
      </header>

      <main class="game-panel">
        <div class="wheel-shell">
          <div class="wheel-pointer"></div>
          <div id="wheel" class="wheel" aria-label="Minecraft challenge wheel"></div>
        </div>

        <div class="panel">
          <p class="challenge-label">Current challenge</p>
          <div id="result" class="result-box">Spin the wheel!</div>
          <button id="spinBtn" class="spin-btn">Spin</button>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
